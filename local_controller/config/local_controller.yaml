standalone_local_controller:
  ros__parameters:
    plan_topic: /plan
    pose_topic: /slam_pose
    goal_topic: /goal_pose
    # cpp_2d_slam이 scan 종료 시점의 base_link 기준으로 deskew해 발행한다.
    scan_topic: /scan_deskewed
    cmd_vel_topic: /cmd_vel
    costmap_topic: /local_costmap
    robot_frame: base_link

    control_frequency: 20.0
    lookahead_distance: 0.4
    max_linear_velocity: 0.2
    max_angular_velocity: 0.8
    goal_position_tolerance: 0.1
    goal_yaw_tolerance: 0.15
    # planner가 start/goal을 free cell로 snap해도 같은 goal의 plan으로 인정한다.
    plan_goal_match_tolerance: 0.75
    # cpp_2d_slam scan matching 시간이 순간적으로 길어져도 불필요하게 0 속도를
    # 반복 발행하지 않도록 pose timeout을 scan timeout보다 넉넉히 둔다.
    pose_timeout: 1.5
    scan_timeout: 0.5

    costmap_width: 4.0
    costmap_height: 4.0
    costmap_resolution: 0.05
    robot_radius: 0.25
    safety_margin: 0.05
    # 이 거리보다 먼 scan point는 Local Costmap 장애물로 사용하지 않는다.
    obstacle_max_range: 2.0

    prediction_horizon: 1.5
    prediction_step: 0.1
    avoidance_hold_time: 0.8
    safe_cycles_required: 5
    blocked_rotate_speed: 0.3

    # 선속도와 각속도를 모두 샘플링한다.
    linear_samples: 5
    angular_samples: 21

    # 명령의 급격한 변화를 줄이는 가속도 제한.
    max_linear_acceleration: 0.3
    max_angular_acceleration: 1.5

    # trajectory score 가중치.
    path_weight: 2.0
    target_weight: 1.0
    heading_weight: 1.0
    obstacle_weight: 0.4
    velocity_weight: 0.5
